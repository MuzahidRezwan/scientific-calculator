<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCalc — Advanced Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow glow-1"></div>
  <div class="background-glow glow-2"></div>

  <main class="calculator-container">
    <header class="calc-header">
      <div class="brand">
        <span class="logo-dot"></span>
        <h1>OmniCalc <span class="badge">PRO</span></h1>
      </div>
      <div class="mode-switch">
        <button id="deg-rad-btn" class="pill-btn" title="Toggle Degrees / Radians">DEG</button>
        <button id="history-toggle" class="icon-btn" title="View History">📜</button>
      </div>
    </header>

    <!-- Display Screen -->
    <section class="screen-wrapper">
      <div class="screen-history" id="expression-display"></div>
      <div class="screen-main" id="main-display">0</div>
      <div class="screen-status">
        <span id="angle-mode-indicator">DEG</span>
        <span id="memory-indicator" class="hidden">M</span>
      </div>
    </section>

    <!-- Keypad Grid -->
    <section class="keypad-grid">
      <!-- Row 1: Memory & Secondary -->
      <button class="btn btn-fn" data-action="mc">MC</button>
      <button class="btn btn-fn" data-action="mr">MR</button>
      <button class="btn btn-fn" data-action="m-plus">M+</button>
      <button class="btn btn-fn" data-action="m-minus">M-</button>
      <button class="btn btn-danger" data-action="clear">AC</button>
      <button class="btn btn-danger" data-action="backspace">⌫</button>

      <!-- Row 2: Trig & Constants -->
      <button class="btn btn-sci" data-action="sin">sin</button>
      <button class="btn btn-sci" data-action="cos">cos</button>
      <button class="btn btn-sci" data-action="tan">tan</button>
      <button class="btn btn-sci" data-action="pi">π</button>
      <button class="btn btn-sci" data-action="e">e</button>
      <button class="btn btn-op" data-op="/">÷</button>

      <!-- Row 3: Advanced Math -->
      <button class="btn btn-sci" data-action="asin">sin⁻¹</button>
      <button class="btn btn-sci" data-action="acos">cos⁻¹</button>
      <button class="btn btn-sci" data-action="atan">tan⁻¹</button>
      <button class="btn btn-sci" data-action="power">x^y</button>
      <button class="btn btn-sci" data-action="square">x²</button>
      <button class="btn btn-op" data-op="*">×</button>

      <!-- Row 4: Log, Roots & Numbers 7-9 -->
      <button class="btn btn-sci" data-action="log">log</button>
      <button class="btn btn-sci" data-action="ln">ln</button>
      <button class="btn btn-sci" data-action="sqrt">√x</button>
      <button class="btn btn-num" data-val="7">7</button>
      <button class="btn btn-num" data-val="8">8</button>
      <button class="btn btn-num" data-val="9">9</button>
      <button class="btn btn-op" data-op="-">−</button>

      <!-- Row 5: Factorial, Parentheses & Numbers 4-6 -->
      <button class="btn btn-sci" data-action="fact">n!</button>
      <button class="btn btn-sci" data-val="(">(</button>
      <button class="btn btn-sci" data-val=")">)</button>
      <button class="btn btn-num" data-val="4">4</button>
      <button class="btn btn-num" data-val="5">5</button>
      <button class="btn btn-num" data-val="6">6</button>
      <button class="btn btn-op" data-op="+">+</button>

      <!-- Row 6: Reciprocal, Percent & Numbers 1-3 -->
      <button class="btn btn-sci" data-action="inv">1/x</button>
      <button class="btn btn-sci" data-action="abs">|x|</button>
      <button class="btn btn-op" data-op="%">%</button>
      <button class="btn btn-num" data-val="1">1</button>
      <button class="btn btn-num" data-val="2">2</button>
      <button class="btn btn-num" data-val="3">3</button>
      <button class="btn btn-equal" id="btn-equals" data-action="calculate">=</button>

      <!-- Row 7: Negate, Zero, Decimal -->
      <button class="btn btn-sci" data-action="exp">EXP</button>
      <button class="btn btn-num" data-action="negate">±</button>
      <button class="btn btn-num btn-zero" data-val="0">0</button>
      <button class="btn btn-num" data-val=".">.</button>
    </section>

    <!-- Calculation History Overlay -->
    <aside class="history-drawer" id="history-drawer">
      <div class="history-header">
        <h3>History</h3>
        <button id="clear-history-btn" class="pill-btn danger">Clear</button>
        <button id="close-history-btn" class="icon-btn">✕</button>
      </div>
      <ul class="history-list" id="history-list">
        <li class="empty-state">No calculations yet</li>
      </ul>
    </aside>

    <footer class="calc-footer">
      <span>Crafted by <a href="https://github.com/MuzahidRezwan" target="_blank">Muzahid Rezwan</a></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
